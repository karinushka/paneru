name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # ⬇️ FORCE RUSTC TO USE XCODE'S LEGITIMATE SDK ⬇️
  SDKROOT: /Applications/Xcode_16.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.0' # Pinning to 16 matching the SDKROOT path above

    - run: rustup update
    - run: cargo build --release --verbose
    - uses: actions/upload-artifact@v4
      with:
        name: paneru-macos
        path: target/release/paneru
